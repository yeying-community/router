openapi: 3.1.0
info:
  title: Router API
  version: 1.0.0
  description: |
    Router HTTP API specification.

    This file is the source of truth for API paths, authentication schemes,
    high-level request bodies, and response envelopes. Business semantics are
    documented in the themed documents under docs/.
servers:
  - url: http://localhost:3000
    description: Local Router server
tags:
  - name: Public Auth
  - name: Public User
  - name: Public Token
  - name: Personal Provider Routing
  - name: Public Logs
  - name: Relay
  - name: Admin Users
  - name: Admin Billing
  - name: Admin Duty
  - name: Admin Channels
  - name: Admin Tasks
  - name: Admin Groups
  - name: Admin Entitlement
  - name: Admin Packages
  - name: Admin Providers
  - name: Admin Logs
  - name: Internal
security:
  - BearerAuth: []
paths:
  /api/v1/public/common/auth/challenge:
    post:
      tags: [Public Auth]
      summary: Create wallet auth challenge, proto style
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/common/auth/verify:
    post:
      tags: [Public Auth]
      summary: Verify wallet signature, proto style
      security: []
      requestBody: { $ref: "#/components/requestBodies/JSONBody" }
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/common/auth/refreshToken:
    post:
      tags: [Public Auth]
      summary: Refresh wallet JWT, proto style
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/auth/challenge:
    post:
      tags: [Public Auth]
      summary: Create wallet auth challenge, web3 style
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/auth/verify:
    post:
      tags: [Public Auth]
      summary: Verify wallet signature, web3 style
      security: []
      requestBody: { $ref: "#/components/requestBodies/JSONBody" }
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/auth/refresh:
    post:
      tags: [Public Auth]
      summary: Refresh wallet JWT, web3 style
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/auth/logout:
    post:
      tags: [Public Auth]
      summary: Logout wallet session
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/profile:
    get:
      tags: [Public User]
      summary: Get public profile from JWT or UCAN
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/status:
    get:
      tags: [Public User]
      summary: Get service status
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/billing/currencies:
    get:
      tags: [Public User]
      summary: List public billing currencies
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/topup/plans:
    get:
      tags: [Public User]
      summary: List public top-up plans
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/notice:
    get:
      tags: [Public User]
      summary: Get public notice
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/about:
    get:
      tags: [Public User]
      summary: Get about content
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/home_page_content:
    get:
      tags: [Public User]
      summary: Get home page content
      security: []
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/topup/callback:
    post:
      tags: [Public User]
      summary: Receive external payment callback
      security:
        - BearerAuth: []
        - TopupCallbackToken: []
      requestBody: { $ref: "#/components/requestBodies/JSONBody" }
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/payment/node/webhook:
    post:
      tags: [Public User]
      summary: Receive signed Node payment webhook
      description: Unauthenticated callback authenticated by Node merchant HMAC headers. Re-delivery of a valid event is idempotent.
      security: []
      parameters:
        - name: X-Yeying-Payment-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-Yeying-Payment-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,13}$' }
        - name: X-Yeying-Payment-Nonce
          in: header
          required: true
          schema: { type: string }
        - name: X-Yeying-Payment-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, type, merchantId, tradeNo, externalOrderId, amountMinor, currency, providerOrderId, paidAt]
              properties:
                eventId: { type: string }
                type: { type: string, enum: [payment.succeeded] }
                merchantId: { type: string }
                tradeNo: { type: string }
                externalOrderId: { type: string, description: Router topup order ID }
                amountMinor: { type: string, pattern: '^[1-9][0-9]*$' }
                currency: { type: string }
                provider: { type: string }
                providerOrderId: { type: string }
                paidAt: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "500": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/public/reset_password:
    get:
      tags: [Public User]
      summary: Send password reset email
      security: []
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200": { $ref: "#/components/responses/APIResponse" }
  /api/v1/public/user/reset:
    post:
      tags: [Public User]
      summary: Reset user password
