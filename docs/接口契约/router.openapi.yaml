components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or API token
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
    TopupCallbackToken:
      type: apiKey
      in: header
      name: X-Topup-Callback-Token
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    SnapshotIDPath:
      name: snapshot_id
      in: path
      required: true
      schema: { type: string }
    PolicyIDPath:
      name: policy_id
      in: path
      required: true
      schema: { type: string }
    CodePath:
      name: code
      in: path
      required: true
      schema: { type: string }
    ModelPath:
      name: model
      in: path
      required: true
      schema: { type: string }
    KindPath:
      name: kind
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [today, 7d, 30d, current_month]
    GroupIDQuery:
      name: group_id
      in: query
      schema: { type: string }
    Email:
      name: email
      in: query
      schema: { type: string, format: email }
    BusinessType:
      name: business_type
      in: query
      schema:
        type: string
        enum: [balance_topup, package_purchase]
    SourceType:
      name: source_type
      in: query
      schema: { type: string }
    TxType:
      name: tx_type
      in: query
      schema:
        type: string
        enum: [credit, consume, expire]
  requestBodies:
    JSONBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    FormOrJSONBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
  responses:
    APIResponse:
      description: Router standard response envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIResponse"
    PaginatedAPIResponse:
      description: Router standard paginated response envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/APIResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PaginatedData"
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/APIResponse"
              - $ref: "#/components/schemas/OpenAIError"
    RelayResponse:
      description: Upstream-compatible relay response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        text/event-stream:
          schema:
            type: string
    OpenAIModelList:
      description: OpenAI-compatible model list response
      content:
        application/json:
          schema:
            type: object
            properties:
              object:
                type: string
                const: list
              data:
                type: array
                items:
                  $ref: "#/components/schemas/OpenAIModel"
    OpenAIModel:
      description: OpenAI-compatible model response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIModel"
  schemas:
    DutyIncidentUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, acknowledged, investigating, mitigated, resolved]
        note:
          type: string
          maxLength: 1000
      additionalProperties: false
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        error:
          nullable: true
      additionalProperties: true
    PaginatedData:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      additionalProperties: true
    OpenAIModel:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          default: model
        created:
          type: integer
        owned_by:
          type: string
        supported_endpoints:
          type: array
          items:
            type: string
      additionalProperties: true
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
              nullable: true
          additionalProperties: true
      additionalProperties: true
